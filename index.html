<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e18">
<title>⚡ Перезагрузка — Игра Привычек</title>
<style>
:root{
  --bg0:#050d1a;--bg1:#0a1628;--bg2:#0f1f35;--bg3:#1a2f4a;
  --card:rgba(30,144,255,.08);--card2:rgba(30,144,255,.14);
  --bd:rgba(30,144,255,.25);--bd2:rgba(30,144,255,.5);
  --cyan:#00d9ff;--blue:#1e90ff;--darkblue:#0066cc;--lightblue:#00bfff;--green:#10B981;--blue:#3B82F6;--yellow:#F59E0B;
  --orange:#FF9F1C;--red:#EF4444;--gold:#FCD34D;--purple:#A78BFA;--grey:#64748B;
  --tx:#e8f0f7;--mut:#93a7bd;--mut2:#64798f;
  --r:18px;--r2:12px;--r3:9px;
  --sh:0 8px 30px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:linear-gradient(165deg,var(--bg1) 0%,var(--bg2) 50%,#0b1424 100%);
  background-attachment:fixed;color:var(--tx);
  font:15px/1.5 'Inter', 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
  min-height:100vh;padding-bottom:90px;overflow-x:hidden;
}
.app{max-width:760px;margin:0 auto;padding:12px 12px 0}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:.2px}
button{font:inherit}

/* ---------- header ---------- */
header.top{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:6px 2px}
.logo{font-size:19px;font-weight:800;background:linear-gradient(135deg,var(--cyan),var(--gold));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sp{flex:1}
.icon-btn{background:var(--card);border:1px solid var(--bd);color:var(--tx);
  padding:8px 11px;border-radius:var(--r3);cursor:pointer;font-size:15px;line-height:1}
.icon-btn:hover{border-color:var(--bd2);background:rgba(0,212,255,.1)}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);
  padding:14px;margin-bottom:12px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.card h2{font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h2 .tag{font-size:11px;color:var(--mut2);font-weight:500}
.mut{color:var(--mut)}.mut2{color:var(--mut2)}
.sm{font-size:12.5px}.xs{font-size:11px}.b{font-weight:700}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.right{margin-left:auto}
.center{text-align:center}
hr.sep{border:0;border-top:1px solid var(--bd);margin:12px 0}
.hidden{display:none!important}

/* ---------- hero (профиль) ---------- */
.hero{background:linear-gradient(135deg,rgba(167,139,250,.22),rgba(0,212,255,.12));
  border:1px solid rgba(167,139,250,.4);border-radius:var(--r);padding:16px;margin-bottom:12px}
.hero-row{display:flex;align-items:center;gap:14px}
.hero-av{width:76px;flex:none;line-height:0}
.hero-t{font-size:12px;color:var(--mut2);letter-spacing:.5px}
.hero-n{font-size:19px;font-weight:800}
.hero-xp{font-size:13px;font-weight:700;color:var(--gold)}
.bar{height:9px;background:rgba(0,0,0,.35);border-radius:99px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.34,1.4,.64,1);
  background:linear-gradient(90deg,var(--purple),var(--cyan))}
.bar.g>i{background:linear-gradient(90deg,var(--green),#34D399)}
.bar.y>i{background:linear-gradient(90deg,var(--yellow),var(--orange))}
.bar.r>i{background:linear-gradient(90deg,var(--red),var(--orange))}
.bar.thin{height:6px}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.kpi{background:rgba(0,0,0,.28);border-radius:var(--r3);padding:9px 6px;text-align:center}
.kpi .v{font-size:17px;font-weight:800;line-height:1.1}
.kpi .k{font-size:9.5px;color:var(--mut2);margin-top:3px}

/* ---------- habit row ---------- */
.hrow{display:flex;align-items:center;gap:11px;padding:11px;border-radius:var(--r2);
  background:rgba(0,0,0,.22);margin-bottom:8px;border:1px solid transparent;transition:.15s}
.hrow.on{background:rgba(16,185,129,.13);border-color:rgba(16,185,129,.4)}
.hrow.frz{background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.35)}
.hico{font-size:21px;width:26px;text-align:center;flex:none}
.hnm{flex:1;min-width:0}
.hnm .n{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hnm .d{font-size:10.5px;color:var(--mut2);margin-top:1px}
.hstr{font-size:13px;font-weight:800;white-space:nowrap;flex:none;min-width:52px;text-align:right}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--bd);background:rgba(0,0,0,.25);
  cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;
  transition:.15s;color:transparent;padding:0}
.chk.on{background:var(--green);border-color:var(--green);color:#04231a}
.chk:disabled{opacity:.45;cursor:not-allowed}
.fire{display:inline-block}
.fire.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}

/* ---------- slot ---------- */
.slot{border:2px dashed var(--bd);border-radius:var(--r2);padding:14px;text-align:center;
  color:var(--mut2);font-size:13px;margin-bottom:8px;cursor:pointer;transition:.15s;background:transparent}
.slot:hover{border-color:var(--bd2);color:var(--cyan)}
.slot.lock{cursor:default;border-style:solid;opacity:.75}
.slot.lock:hover{border-color:var(--bd);color:var(--mut2)}

/* ---------- goal ---------- */
.goal{border-radius:var(--r2);padding:13px;margin-bottom:10px;background:rgba(0,0,0,.22);
  border-left:4px solid var(--grey);border-top:1px solid var(--bd);
  border-right:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.goal.t0{border-left-color:var(--green)}
.goal.t1{border-left-color:var(--blue)}
.goal.t2{border-left-color:var(--yellow)}
.goal.t3{border-left-color:var(--red);background:rgba(239,68,68,.09)}
.goal.t4{border-left-color:var(--grey);opacity:.72}
.goal.done{border-left-color:var(--gold);background:rgba(252,211,77,.08)}
.gtop{display:flex;align-items:center;gap:10px}
.gico{font-size:22px;flex:none}
.gttl{flex:1;min-width:0}
.gttl .n{font-size:15px;font-weight:700}
.gttl .s{font-size:11.5px;margin-top:2px}
.pill{font-size:10.5px;padding:3px 9px;border-radius:99px;border:1px solid var(--bd);
  color:var(--mut);white-space:nowrap;display:inline-block}
.pill.g{color:var(--green);border-color:rgba(16,185,129,.45);background:rgba(16,185,129,.1)}
.pill.b{color:var(--blue);border-color:rgba(59,130,246,.45);background:rgba(59,130,246,.1)}
.pill.y{color:var(--yellow);border-color:rgba(245,158,11,.45);background:rgba(245,158,11,.1)}
.pill.r{color:var(--red);border-color:rgba(239,68,68,.45);background:rgba(239,68,68,.1)}
.pill.gold{color:var(--gold);border-color:rgba(252,211,77,.45);background:rgba(252,211,77,.1)}
.pill.c{color:var(--cyan);border-color:var(--bd2);background:rgba(0,212,255,.1)}

/* ---------- buttons ---------- */
.btn{color:var(--tx);background:var(--card2);border:1px solid var(--bd);
  border-radius:var(--r3);padding:9px 13px;cursor:pointer;transition:.15s;font-size:13.5px}
.btn:hover{border-color:var(--bd2);background:rgba(0,212,255,.12)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:linear-gradient(135deg,rgba(0,212,255,.3),rgba(0,212,255,.12));
  border-color:var(--bd2);font-weight:700}
.btn.ok{background:rgba(16,185,129,.2);border-color:rgba(16,185,129,.5);font-weight:700}
.btn.dng{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.4)}
.btn.gold{background:rgba(252,211,77,.18);border-color:rgba(252,211,77,.45);font-weight:700}
.btn.mini{padding:5px 9px;font-size:11.5px;border-radius:8px}
.btn.wide{width:100%;padding:13px;font-size:15px}

/* ---------- inputs ---------- */
input,select,textarea{color:var(--tx);background:rgba(0,0,0,.35);border:1px solid var(--bd);
  border-radius:var(--r3);padding:9px 11px;font:inherit;max-width:100%;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--bd2)}
textarea{resize:vertical;min-height:52px}
label.lb{font-size:11px;color:var(--mut2);display:block;margin-bottom:4px}
.fgrid{display:grid;gap:9px;grid-template-columns:1fr 1fr}
.fgrid .full{grid-column:1/-1}
@media(max-width:520px){.fgrid{grid-template-columns:1fr}}
input[type=range]{padding:0;background:transparent;accent-color:var(--cyan)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--green);padding:0}

/* ---------- emoji picker ---------- */
.emoji-pick{display:flex;flex-wrap:wrap;gap:5px;max-height:112px;overflow-y:auto;
  padding:8px;background:rgba(0,0,0,.3);border-radius:var(--r3);border:1px solid var(--bd)}
.emoji-pick button{width:36px;height:36px;font-size:19px;border-radius:8px;border:1px solid transparent;
  background:transparent;cursor:pointer;padding:0}
.emoji-pick button.on{border-color:var(--cyan);background:rgba(0,212,255,.18)}

/* ---------- nav ---------- */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:60;display:flex;
  background:rgba(10,16,28,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;background:transparent;border:0;padding:7px 2px;cursor:pointer;
  color:var(--mut2);display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:9.5px;border-radius:10px;transition:.15s}
nav.tabs button .ic{font-size:19px;line-height:1}
nav.tabs button.on{color:var(--cyan);background:rgba(0,212,255,.1)}

/* ---------- lists ---------- */
ul.lst{list-style:none;margin:0;padding:0}
ul.lst>li{display:flex;align-items:center;gap:9px;padding:9px 0;
  border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}
ul.lst>li:last-child{border-bottom:0}
ul.lst>li .tx{flex:1;min-width:0;word-break:break-word}

/* ---------- achievements ---------- */
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.ach{background:rgba(0,0,0,.25);border:1px solid var(--bd);border-radius:var(--r3);
  padding:9px 4px;text-align:center;opacity:.38}
.ach.un{opacity:1;border-color:rgba(252,211,77,.5);background:rgba(252,211,77,.1)}
.ach .i{font-size:21px;line-height:1.2}
.ach .n{font-size:9px;margin-top:4px;color:var(--tx);line-height:1.25}
.ach .d{font-size:8.5px;color:var(--mut2);margin-top:2px}

/* ---------- money ---------- */
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mbox{background:rgba(0,0,0,.26);border-radius:var(--r3);padding:10px}
.mbox .k{font-size:10px;color:var(--mut2)}
.mbox .v{font-size:16px;font-weight:800;margin-top:2px}
.catbar{display:grid;grid-template-columns:92px 1fr 84px;gap:8px;align-items:center;
  font-size:12px;margin-bottom:7px}
.catbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut)}
.catbar .am{text-align:right;font-weight:600}
.seg{display:flex;gap:4px;background:rgba(0,0,0,.3);padding:3px;border-radius:10px}
.seg button{flex:1;background:transparent;border:0;color:var(--mut2);padding:6px;
  border-radius:8px;cursor:pointer;font-size:12px}
.seg button.on{background:rgba(0,212,255,.16);color:var(--cyan);font-weight:700}

/* ---------- heat map / chart ---------- */
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:rgba(255,255,255,.05);display:block}
canvas{width:100%;display:block}

/* ---------- toast / modal ---------- */
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(16px);
  background:rgba(12,22,38,.97);border:1px solid var(--bd2);color:var(--tx);padding:11px 18px;
  border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:120;
  box-shadow:var(--sh);max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:200;
  display:none;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.mbody{background:linear-gradient(150deg,var(--bg2),var(--bg3));border:1px solid var(--bd);
  border-radius:20px;padding:20px;max-width:440px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--sh)}
.mbody h3{font-size:17px;margin-bottom:14px}
.mbig{font-size:52px;text-align:center;line-height:1.1}

/* ---------- confetti / shake ---------- */
@keyframes cfall{0%{transform:translateY(-20px) rotate(0);opacity:1}
  100%{transform:translateY(105vh) rotate(720deg);opacity:0}}
.cfti{position:fixed;top:-20px;font-size:20px;pointer-events:none;z-index:150;animation:cfall linear forwards}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}
  40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shake{animation:shk .55s ease-in-out}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(252,211,77,.6)}50%{box-shadow:0 0 0 16px rgba(252,211,77,0)}}
.glow{animation:glow 1.1s ease-out 2}

.banner{border-radius:var(--r2);padding:11px 13px;margin-bottom:10px;font-size:13px;
  border:1px solid rgba(239,68,68,.5);background:rgba(239,68,68,.14)}
.banner.info{border-color:var(--bd2);background:rgba(0,212,255,.11)}
.banner.gold{border-color:rgba(252,211,77,.5);background:rgba(252,211,77,.12)}
footer.ft{color:var(--mut2);font-size:10.5px;text-align:center;padding:14px 6px;line-height:1.6}

/* ===================== ПОЛНОЭКРАННОЕ ПРАЗДНОВАНИЕ ===================== */
.celebrate{
  position:fixed; inset:0; z-index:300; display:none;
  align-items:center; justify-content:center; flex-direction:column;
  background:radial-gradient(circle at 50% 42%, rgba(30,144,255,.22), rgba(3,8,16,.93) 62%);
  backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
  animation:celIn .3s ease-out; cursor:pointer; padding:20px;
}
.celebrate.show{display:flex}
.celebrate.out{animation:celOut .28s ease-in forwards}
@keyframes celIn{from{opacity:0}to{opacity:1}}
@keyframes celOut{to{opacity:0}}

/* лучи за спиной */
.cel-rays{
  position:absolute; width:150vmax; height:150vmax; pointer-events:none; opacity:.22;
  background:repeating-conic-gradient(from 0deg,
    rgba(0,217,255,.5) 0deg 9deg, transparent 9deg 18deg);
  animation:celSpin 14s linear infinite; filter:blur(1px);
}
.lv1 .cel-rays{opacity:.10}
.lv3 .cel-rays{opacity:.32;
  background:repeating-conic-gradient(from 0deg,
    rgba(255,215,0,.55) 0deg 8deg, transparent 8deg 16deg)}
@keyframes celSpin{to{transform:rotate(360deg)}}

.cel-stage{position:relative; text-align:center; animation:celPop .5s cubic-bezier(.34,1.6,.5,1)}
@keyframes celPop{0%{transform:scale(.5) translateY(50px);opacity:0}
  100%{transform:scale(1) translateY(0);opacity:1}}

.cel-hero{width:min(56vw,240px); height:auto; display:block; margin:0 auto;
  filter:drop-shadow(0 14px 34px rgba(0,0,0,.6))}

/* качок подпрыгивает */
.cel-body{animation:celJump .52s ease-in-out infinite; transform-origin:130px 250px}
@keyframes celJump{0%,100%{transform:translateY(0) scaleY(1)}
  38%{transform:translateY(-17px) scaleY(1.03)}
  70%{transform:translateY(0) scaleY(.97)}}
.lv1 .cel-body{animation-duration:.72s}
.cel-shadow{animation:celSh .52s ease-in-out infinite}
@keyframes celSh{0%,100%{transform:scale(1);opacity:.45}38%{transform:scale(.76);opacity:.24}}
.lv1 .cel-shadow{animation-duration:.72s}

/* руки сводятся — хлопок */
.cel-armL{animation:clapL .26s ease-in-out infinite; transform-origin:92px 112px}
.cel-armR{animation:clapR .26s ease-in-out infinite; transform-origin:168px 112px}
@keyframes clapL{0%,100%{transform:rotate(-26deg)}50%{transform:rotate(16deg)}}
@keyframes clapR{0%,100%{transform:rotate(26deg)}50%{transform:rotate(-16deg)}}
.lv1 .cel-armL,.lv1 .cel-armR{animation-duration:.4s}

/* голова покачивается, глаза моргают */
.cel-head{animation:celHead 1.1s ease-in-out infinite; transform-origin:130px 100px}
@keyframes celHead{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.cel-eyes{animation:celBlink 3.1s infinite}
@keyframes celBlink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.cel-mouth{animation:celMouth .52s ease-in-out infinite; transform-origin:130px 80px}
@keyframes celMouth{0%,100%{transform:scaleY(1)}40%{transform:scaleY(1.5)}}

/* вспышка в момент хлопка */
.cel-clapfx{animation:celFx .26s ease-out infinite; transform-origin:130px 172px; opacity:0}
@keyframes celFx{0%{opacity:0;transform:scale(.2)}
  46%{opacity:0;transform:scale(.3)}
  58%{opacity:1;transform:scale(1.5)}
  100%{opacity:0;transform:scale(2.1)}}
.lv1 .cel-clapfx{animation-duration:.4s}

/* тексты */
.cel-title{
  margin-top:16px; font-family:'Space Grotesk',sans-serif; font-weight:800;
  font-size:clamp(24px,7.5vw,40px); letter-spacing:-.6px; line-height:1.1;
  background:linear-gradient(135deg,#00d9ff,#7ee8ff,#fff);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  animation:celTitleIn .45s .1s backwards cubic-bezier(.34,1.6,.5,1);
}
.lv3 .cel-title{background:linear-gradient(135deg,#FFD700,#FFF3A0,#fff);
  -webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 0 18px rgba(255,215,0,.5))}
@keyframes celTitleIn{from{transform:translateY(18px) scale(.85);opacity:0}}
.cel-sub{margin-top:7px; color:#bcd6f0; font-size:clamp(13px,3.6vw,16px); font-weight:600}
.cel-xp{margin-top:12px; display:inline-block; padding:7px 20px; border-radius:99px;
  font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:17px; color:#0a1628;
  background:linear-gradient(135deg,#FFD700,#FFB800);
  box-shadow:0 6px 22px rgba(255,215,0,.45);
  animation:celXpIn .45s .22s backwards cubic-bezier(.34,1.8,.5,1)}
@keyframes celXpIn{from{transform:scale(.3) rotate(-12deg);opacity:0}}
.cel-hint{margin-top:20px; font-size:11px; color:rgba(255,255,255,.4); letter-spacing:.4px}

@media(max-width:420px){.cel-hero{width:64vw}}


/* ---- герой: общий ---- */
.hero-svg{width:100%;height:auto;display:block}
.lvl-up-hero{width:150px;margin:0 auto 10px}
.hero-av .hero-svg{filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}

/* ---- ГРУСТНАЯ реакция: не прыгает, опускает плечи, отворачивается ---- */
.mood-sad .cel-body{animation:sadIdle 3.2s ease-in-out both}
@keyframes sadIdle{
  0%{transform:translateY(0) scale(1)}
  12%{transform:translateY(4px) scale(.985)}      /* вздох, плечи вниз */
  55%{transform:translateY(4px) scale(.985)}
  100%{transform:translateY(6px) scale(.98)}
}
/* разворот: лицо гаснет, затылок проявляется */
.mood-sad .cel-head{animation:sadTurn 3.2s ease-in-out both;transform-box:fill-box}
@keyframes sadTurn{
  0%,42%{transform:rotate(0) translateX(0)}
  62%{transform:rotate(-7deg) translateX(-5px)}
  100%{transform:rotate(-9deg) translateX(-7px)}
}
.mood-sad .cel-front{animation:sadFadeOut 3.2s ease-in-out both}
@keyframes sadFadeOut{0%,52%{opacity:1}70%,100%{opacity:0}}
.mood-sad .cel-back{animation:sadFadeIn 3.2s ease-in-out both}
@keyframes sadFadeIn{0%,52%{opacity:0}70%,100%{opacity:1}}
.mood-sad .cel-eyes{animation:sadBlink 2.4s ease-in-out infinite}
@keyframes sadBlink{0%,88%,100%{transform:scaleY(1)}94%{transform:scaleY(.15)}}
.mood-sad .cel-shadow{animation:none;opacity:.5}
.mood-sad .cel-rays{opacity:.05;animation-duration:40s}
.mood-sad .celebrate,.celebrate.mood-sad{

<script>
'use strict';
/* ============================================================================
   ПЕРЕЗАГРУЗКА v4 — привычки · цели · финансы
   Один файл, без зависимостей, ES6+. Хранилище: localStorage + IndexedDB.
   ========================================================================== */

const KEY='perezagruzka_v4', SCHEMA=4, BUILD='5.0 · знакомство + свои привычки';
const MAX_SLOTS=10, START_SLOTS=3, MAX_FREEZE=2, FREEZE_EVERY=10, AUTOCLOSE_LAG=2;
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const DOW=['ВС','ПН','ВТ','СР','ЧТ','ПТ','СБ'];
const LEVELS=['Малыш','Новичок','Крепыш','Атлет','Боец','Мастер','Чемпион','Титан'];
const LEVEL_DESC=['Только начал','Уже втянулся','Появилась форма','Виден рельеф',
                  'Серьёзная сила','Мощь и опыт','Почти вершина','Абсолютная вершина'];
const LEAKS=['Кофеин','Никотин','Алкоголь','Сахар'];
const EMOJI=['☕','🚬','🍰','🍺','💧','🏃','🌅','😴','🍽','📖','🧘','💳','🎓','💰','💪','🎯','🏋️','🚴','🧠','📝','🎸','🎨','🌱','🧹','☎️','🐕','👨‍👩‍👦','🔥','⭐','🚀','🛏️','🥗','🧴','💊','🦷','📵','🎧','🗣️','✍️','🧮'];

const HABIT_LIB=[
  {id:'caffeine',name:'Без кофеина',icon:'☕',type:'avoid',desc:'Кофе, чай с кофеином, энергетики'},
  {id:'nicotine',name:'Без никотина',icon:'🚬',type:'avoid',desc:'Сигареты, вейп, паучи, кальян'},
  {id:'sugar',name:'Без сахара',icon:'🍰',type:'avoid',desc:'Добавленный сахар в любом виде'},
  {id:'alcohol',name:'Без алкоголя',icon:'🍺',type:'avoid',desc:''},
  {id:'water',name:'2 литра воды',icon:'💧',type:'action',desc:''},
  {id:'stretch',name:'Зарядка или разминка',icon:'🏃',type:'action',desc:'Даже 5 минут считается'},
  {id:'wake',name:'Подъём до 08:00',icon:'🌅',type:'action',desc:''},
  {id:'sleep',name:'Лечь до 00:00',icon:'😴',type:'action',desc:'Отмечается утром следующего дня'},
  {id:'calories',name:'Калории в лимите',icon:'🍽',type:'action',desc:''},
  {id:'read',name:'10 минут чтения',icon:'📖',type:'action',desc:''},
  {id:'meditate',name:'Медитация',icon:'🧘',type:'action',desc:''},
  {id:'expenses',name:'Записать расходы',icon:'💳',type:'action',desc:'Отмечается во вкладке «Финансы»',mirror:true}
];

/* ------------------------------- даты ----------------------------------- */
/* Никакого toISOString(): он уводит дату в UTC и после 21:00 даёт вчера. */
let NOW=null;                                     // подмена «сегодня» для тестов
const D=s=>{const p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2]);};
const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>NOW||fmt(new Date());
const nowISO=()=>{const d=new Date();return today()+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
const addD=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return fmt(d);};
const diffD=(a,b)=>Math.round((D(b)-D(a))/864e5);
const monday=s=>{const d=D(s),w=d.getDay()||7;d.setDate(d.getDate()-(w-1));return fmt(d);};
const weekDays=s=>{const m=monday(s);return Array.from({length:7},(_,i)=>addD(m,i));};
const human=s=>{const d=D(s);return d.getDate()+' '+MON[d.getMonth()];};
const humanFull=s=>DOW[D(s).getDay()]+', '+human(s);
/* обращение по имени: если имени нет — нейтральная фраза без «пустоты» */
const uname=()=>(S?.user?.name||'').trim();
const nameOr=(fb='')=>uname()||fb;
/* «Константин, молодец» / «Молодец» — с корректной заглавной */
const withName=(phrase,{comma=true}={})=>{
  const n=uname();
  if(!n)return phrase.charAt(0).toUpperCase()+phrase.slice(1);
  return n+(comma?', ':' ')+phrase;
};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const money=n=>(Math.round(n*100)/100).toLocaleString('ru-RU')+' '+(S?.settings?.currency||'₽');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ------------------------------ состояние ------------------------------- */
let S=null, view='home', sel=null, chartRange=30;

function fresh(){
  const t=today();
  return {
    version:SCHEMA, createdAt:t,
    settings:{sound:{enabled:true,volume:.5},vibration:true,animations:true,
              currency:'₽',autoClose:true,monthBudget:0,lastExport:null},
    slots:{unlocked:START_SLOTS,max:MAX_SLOTS},
    freezes:{available:0,max:MAX_FREEZE,earnedAt:[]},
    habits:[], logs:{}, closed:{},
    goals:[],
    money:{ops:[],
      catsExpense:['Продукты','Кафе и доставка','Транспорт','Жильё','Подписки','Кофеин','Никотин','Алкоголь','Сахар','Развлечения','Здоровье','Одежда','Другое'],
      catsIncome:['Зарплата','Подработка','Возврат','Подарок','Другое'],
      closed:{}},
    ledger:[], profile:{xp:0,level:1,total:0},
    challenges:{date:t,list:[]},
    achievements:[],
    stats:{daysTracked:0,totalChecks:0,goalsCompleted:0},
    user:{name:'',greetedAt:null},
    onboarded:false
  };
}

/* --------------------------- загрузка/миграция -------------------------- */
const valid=o=>!!o&&typeof o==='object'&&Array.isArray(o.habits)&&Array.isArray(o.goals)
  &&o.logs&&o.closed&&o.money&&Array.isArray(o.money.ops);

function migrate(o){
  o.version=SCHEMA;
  o.settings={...fresh().settings,...(o.settings||{})};
  o.slots=o.slots||{unlocked:START_SLOTS,max:MAX_SLOTS};
  o.freezes=o.freezes||{available:0,max:MAX_FREEZE,earnedAt:[]};
  o.profile=o.profile||{xp:0,level:1,total:0};
  if(!Array.isArray(o.ledger)){
    /* у старых данных журнала нет — переносим накопленное одной записью,
       чтобы прогресс не обнулился */
    o.ledger=[];
    let legacy=+o.profile.xp||0;
    for(let i=1;i<(+o.profile.level||1);i++)legacy+=Math.round(1000*Math.pow(1.25,i-1));
    if(legacy>0)o.ledger.push({k:'legacy:profile',v:legacy,t:'p',h:null,d:o.createdAt||today(),r:'Перенос прогресса'});
    (o.habits||[]).forEach(h=>{
      let lx=+h.xp||0;
      for(let i=1;i<(+h.level||1);i++)lx+=Math.round(100*Math.pow(1.25,i-1));
      if(lx>0)o.ledger.push({k:'legacy:h:'+h.id,v:lx,t:'h',h:h.id,d:o.createdAt||today(),r:'Перенос прогресса'});
    });
  }
  o.challenges=o.challenges||{date:today(),list:[]};
  o.achievements=o.achievements||[];
  o.stats=o.stats||{daysTracked:0,totalChecks:0,goalsCompleted:0};
  o.user=o.user||{name:'',greetedAt:null};
  o.habits.forEach(h=>{h.streak??={current:0,peak:0,lost:0,lastDate:null};h.history??={};h.xp??=0;h.level??=1;h.state??='active';});
  o.goals.forEach(g=>{g.log??=[];g.milestones??=[];g.weeklyTarget??=3;g.state??='active';g.weekStreak??=0;g.deadlineChanges??=0;});
  return o;
}

function load(){
  let raw=null;
  try{raw=localStorage.getItem(KEY);}catch(e){}
  if(!raw){S=fresh();return;}
  let o=null; try{o=JSON.parse(raw);}catch(e){}
  S=valid(o)?migrate(o):fresh();
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}
  catch(e){toast('Не удалось сохранить — хранилище переполнено');}
  idbSave();
}
let idb=null;
function idbOpen(){try{const r=indexedDB.open('perezagruzka',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>idb=r.result;}catch(e){}}
function idbSave(){try{idb&&idb.transaction('kv','readwrite').objectStore('kv').put(JSON.stringify(S),'s');}catch(e){}}

/* ------------------------------ выборки --------------------------------- */
const actHabits=()=>S.habits.filter(h=>h.state==='active');
const habit=id=>S.habits.find(h=>h.id===id);
const goal=id=>S.goals.find(g=>g.id===id);
const actGoals=()=>S.goals.filter(g=>g.state==='active');
const isChecked=(d,id)=>!!(S.logs[d]||{})[id];
const dayDone=d=>actHabits().filter(h=>isChecked(d,h.id)).length;

/* ------------------------------ XP/уровни -------------------------------
   ЖУРНАЛ НАЧИСЛЕНИЙ. Каждая награда — запись с уникальным ключом.
   Повторно тот же ключ не начисляется, отмена события списывает ровно его.
   Это закрывает фарм вида «закрыл → открыл → закрыл».                     */
const lvlNeed=n=>Math.round(100*Math.pow(1.25,n-1));         // порог уровня привычки
const profNeed=n=>Math.round(1000*Math.pow(1.25,n-1));       // порог общего уровня

const ledger=()=>(S.ledger??=[]);
const hasXP=k=>ledger().some(e=>e.k===k);

/* уровень и остаток из общей суммы */
function levelOf(total,needFn,maxLv){
  let lv=1,rest=Math.max(0,total);
  while(lv<maxLv&&rest>=needFn(lv)){rest-=needFn(lv);lv++;}
  return {level:lv,xp:rest};
}
function recomputeXP(){
  let pTotal=0; const hTotal={};
  ledger().forEach(e=>{
    if(e.t==='h'){hTotal[e.h]=(hTotal[e.h]||0)+e.v;}
    else pTotal+=e.v;
  });
  const before=S.profile.level;
  const p=levelOf(pTotal,profNeed,LEVELS.length);
  S.profile={xp:p.xp,level:p.level,total:pTotal};
  S.habits.forEach(h=>{
    const l=levelOf(hTotal[h.id]||0,lvlNeed,10);
    h.xp=l.xp; h.level=l.level; h.xpTotal=hTotal[h.id]||0;
  });
  return {levelUp:p.level>before,from:before,to:p.level};
}
function levelUpFx(){
  sfx('level-up');buzz([50,100,50]);confetti(34);applause(3);
  modal(`<div class="lvl-up-hero">${heroSVG(S.profile.level,'clap',true)}</div>
    <h3 class="center">${nameOr('Ты')}, новый уровень!</h3>
    <p class="center b">Уровень ${S.profile.level} · ${LEVELS[S.profile.level-1]}</p>
    <p class="center mut">${LEVEL_DESC[S.profile.level-1]||''}</p>
    <p class="center xs mut2">Твой герой стал крупнее</p>
    <button class="btn pri wide" data-act="closeModal">Продолжить</button>`);
}
/* выдать награду по ключу (идемпотентно) */
function grantXP(key,amount,opt={}){
  if(!amount||hasXP(key))return 0;
  ledger().push({k:key,v:amount,t:opt.habit?'h':'p',h:opt.habit||null,d:today(),r:opt.reason||''});
  const r=recomputeXP();
  if(r.levelUp&&!opt.silent)levelUpFx();
  return amount;
}
/* отменить награду(ы): точный ключ или префикс */
function revokeXP(key,{prefix=false}={}){
  const before=ledger().length;
  S.ledger=ledger().filter(e=>prefix?!e.k.startsWith(key):e.k!==key);
  if(S.ledger.length!==before)recomputeXP();
  return before-S.ledger.length;
}
/* обратная совместимость со старыми вызовами */
function addProfXP(n){ if(n)grantXP('misc:'+uid(),n); }
function addHabitXP(h,n){ if(n)grantXP('misc:'+uid(),n,{habit:h.id,silent:true}); }

/* --------------------------- стрики привычек ----------------------------
   Пересчёт по фактической истории отметок — устойчиво к заполнению
   задним числом и к повторному закрытию дня.                              */
function recalcStreak(h){
  const days=Object.keys(S.closed).filter(d=>d<=today()).sort();
  let cur=0,peak=0,lost=0,last=null;
  const hist={};
  for(const d of days){
    if(h.startedAt&&d<h.startedAt){continue;}
    if(isChecked(d,h.id)){cur++;last=d;}
    else if(S.closed[d].frozen?.includes(h.id)){/* заморожен — серия держится */}
    else {if(cur>0)lost++;cur=0;}
    peak=Math.max(peak,cur);
    hist[d]=cur;
  }
  h.streak={current:cur,peak:Math.max(peak,h.streak?.peak||0),lost,lastDate:last};
  h.history=hist;
}
function recalcAll(){S.habits.forEach(recalcStreak);}

/* ----------------------------- слоты ------------------------------------ */
const slotsNeed=()=>Math.ceil(actHabits().length*2/3);
const slotsReady=()=>actHabits().filter(h=>h.streak.current>=7).length;
function checkSlot(){
  const a=actHabits().length;
  if(a<S.slots.unlocked)return false;                 // есть свободный слот
  if(S.slots.unlocked>=MAX_SLOTS)return false;
  if(slotsReady()>=slotsNeed()&&a>0){
    S.slots.unlocked++;
    sfx('unlock');buzz([50,100,50,100,150]);confetti(40);applause(3);
    modal(`<div class="mbig">🔓</div><h3 class="center">${nameOr('Готово')}, новый слот открыт!</h3>
      <p class="center mut">Вы удержали ${slotsReady()} привычки неделю и больше — можно взять ещё одну.</p>
      <button class="btn pri wide" data-act="closeModal">Отлично</button>`);
    return true;
  }
  return false;
}

/* ---------------------------- заморозки --------------------------------- */
function grantFreeze(){
  const best=Math.max(0,...S.habits.map(h=>h.streak.current));
  const earned=Math.floor(best/FREEZE_EVERY);
  const already=S.freezes.earnedAt.length;
  if(earned>already && S.freezes.available<MAX_FREEZE){
    S.freezes.available=Math.min(MAX_FREEZE,S.freezes.available+1);
    S.freezes.earnedAt.push(today());
    toast('❄️ Получена заморозка стрика');
  }
}

/* --------------------------- завершение дня ----------------------------- */
function closeDay(date,auto=false){
  if(date>today())return false;
  const hs=actHabits();
  if(!hs.length)return false;
  const already=!!S.closed[date];
  const done=hs.filter(h=>isChecked(date,h.id)).length;

  /* заморозка: пропущенные привычки спасаются, если есть запас */
  const missed=hs.filter(h=>!isChecked(date,h.id)&&h.streak.current>0);
  const frozen=[];
  if(!already&&missed.length&&S.freezes.available>0&&missed.length<=S.freezes.available){
    missed.forEach(h=>frozen.push(h.id));
    S.freezes.available-=missed.length;
    sfx('freeze');buzz([80,40,80]);
  }
  const xp=done*10;
  S.closed[date]={done,total:hs.length,xp,closedAt:nowISO(),frozen,auto};

  recalcAll();
  /* начисления привязаны к дате: повторное закрытие ничего не добавит */
  hs.forEach(h=>{
    if(isChecked(date,h.id)){
      grantXP(`hday:${h.id}:${date}`,10,{habit:h.id,silent:true});
      const s=h.streak.current;
      if([7,14,30,60,100].includes(s)){
        const k=`hmile:${h.id}:${s}:${date}`;
        if(!hasXP(k)){
          grantXP(k,25,{habit:h.id,silent:true});
          grantXP(`pmile:${h.id}:${s}:${date}`,25);
          if(!auto){sfx('milestone');buzz([100,50,100,50,100]);confetti(24);}
        }
      }
    } else {
      /* привычка снята — снимаем и награды за неё в этот день */
      revokeXP(`hday:${h.id}:${date}`);
      revokeXP(`hmile:${h.id}:`,{prefix:true});
      revokeXP(`pmile:${h.id}:`,{prefix:true});
    }
  });
  grantXP(`day:${date}`,xp,{silent:auto});
  S.stats.daysTracked=Object.keys(S.closed).length;
  S.stats.totalChecks=Object.keys(S.logs).reduce((a,d)=>a+Object.keys(S.logs[d]).length,0);
  const brokeAll=hs.filter(h=>!isChecked(date,h.id)&&!frozen.includes(h.id));
  if(!already&&brokeAll.length){buzz([200,100,200]);shakeEl('#view');}

  grantFreeze(); checkSlot(); checkChallenges(); checkAch();
  save();
  return true;
}
function openDay(date){
  delete S.closed[date];
  /* снимаем всё, что было начислено за этот день */
  const back=revokeXP(`day:${date}`)+
    S.habits.reduce((a,h)=>a+revokeXP(`hday:${h.id}:${date}`)+
      revokeXP(`hmile:${h.id}:`,{prefix:true})+revokeXP(`pmile:${h.id}:`,{prefix:true}),0);
  S.stats.daysTracked=Object.keys(S.closed).length;
  recalcAll(); save(); render();
  toast(back?'День открыт · начисленные XP списаны':'День открыт для правки');
}
function autoClose(){
  if(!S.settings.autoClose||!actHabits().length)return 0;
  const edge=addD(today(),-AUTOCLOSE_LAG);
  let n=0,d=S.createdAt;
  while(d<=today()){
    if(d<=edge&&!S.closed[d]&&d>=S.createdAt){if(closeDay(d,true))n++;}
    d=addD(d,1);
  }
  return n;
}

/* ------------------------------ цели ------------------------------------ */
const goalDays=g=>{const s=new Set(g.log.map(l=>l.date));return [...s].sort();};
const lastTouch=g=>{const d=goalDays(g);return d.length?d[d.length-1]:null;};
function temp(g){
  const lt=lastTouch(g);
  if(!lt)return {t:diffD(g.createdAt,today())>=7?3:2,n:'Ни одного занятия',cls:'t2'};
  const gap=diffD(lt,today());
  if(gap===0)return {t:0,n:'Занимались сегодня',cls:'t0',gap};
  if(gap<=2)return {t:1,n:`Последнее занятие ${gap} дн. назад`,cls:'t1',gap};
  if(gap<=6)return {t:2,n:`Не касались ${gap} дн. — пора вернуться`,cls:'t2',gap};
  if(gap<=13)return {t:3,n:`Неделя без внимания! Займитесь сегодня`,cls:'t3',gap};
  return {t:4,n:`${gap} дн. тишины. Вернуться или архивировать?`,cls:'t4',gap};
}
const TEMPNAME=['🟢 В работе','🔵 Идёт','🟡 Остывает','🔥 Горит','🧊 Заброшено'];
const TEMPPILL=['g','b','y','r',''];
const weekCount=(g,d=today())=>{const w=weekDays(d);return goalDays(g).filter(x=>w.includes(x)).length;};
function pace(g){                      // занятий в неделю за последние 28 дней
  const from=addD(today(),-28);
  return goalDays(g).filter(d=>d>=from).length/4;
}
function forecast(g){
  if(!g.deadline)return null;
  const left=diffD(today(),g.deadline);
  if(left<0)return {over:true,left};
  const p=pace(g);
  return {over:false,left,weeks:left/7,p,expect:Math.round(p*left/7)};
}
function touchGoal(id,note,minutes){
  const g=goal(id); if(!g)return;
  const d=today();
  const first=!goalDays(g).includes(d);
  g.log.push({id:uid(),date:d,note:note||'',minutes:minutes||null});
  /* ключ по дате: удалил запись и записал снова — XP не задвоится */
  const got=first?grantXP(`gday:${g.id}:${d}`,15,{reason:'Занятие: '+g.title}):0;
  if(got){sfx('progress');buzz([40]);}
  syncWeekNorm(g,d);
  const c=weekCount(g,d);
  if(!first)toast('Ещё одна запись за сегодня (считается как одно занятие)');
  else if(c>=g.weeklyTarget)toast(`🎯 Норма недели выполнена! · ${c}/${g.weeklyTarget}`);
  else toast(`✓ Занятие записано · +15 XP · ${c}/${g.weeklyTarget} на неделе`);
  checkChallenges(); checkAch(); save();
}
/* Норма недели пересчитывается по факту: выполнена — начислить, отменена — списать */
function syncWeekNorm(g,d=today()){
  const wk=monday(d), key=`gweek:${g.id}:${wk}`;
  const done=weekCount(g,d)>=g.weeklyTarget;
  if(done&&!hasXP(key)){
    grantXP(key,50,{reason:'Норма недели: '+g.title});
    g.weekStreak=weekStreakOf(g);
    celebrate(2,withName('норма недели выполнена!'),
      `${g.icon} ${g.title} · ${g.weekStreak} нед. подряд`,50,'cheer');
  } else if(!done&&hasXP(key)){
    revokeXP(key); g.weekStreak=weekStreakOf(g);
    toast('Норма недели больше не выполнена · 50 XP списаны');
  } else {
    g.weekStreak=weekStreakOf(g);
  }
}
/* стрик недель считаем по факту журнала занятий */
function weekStreakOf(g){
  let n=0,w=monday(today());
  /* текущая неделя учитывается, только если норма уже выполнена */
  if(weekCount(g,w)<g.weeklyTarget)w=addD(w,-7);
  while(w>=monday(g.createdAt)){
    if(weekCount(g,w)>=g.weeklyTarget){n++;w=addD(w,-7);}else break;
  }
  return n;
}
function completeGoal(id){
  const g=goal(id); if(!g)return;
  g.state='done'; g.completedAt=today();
  S.stats.goalsCompleted++;
  let xp=500, early=g.deadline&&today()<g.deadline;
  if(early)xp+=100;
  const got=grantXP(`goal:${g.id}`,xp,{reason:'Цель: '+g.title});
  if(!got){ toast('Эта цель уже была засчитана'); g.state='done'; save(); return; }
  celebrate(3,withName('цель достигнута!').toUpperCase(),g.title+(early?' · досрочно!':''),xp,'clap');
  setTimeout(()=>modal(`<div class="mbig">🏆</div><h3 class="center">Цель достигнута!</h3>
    <p class="center mut">${esc(g.title)}</p>
    <p class="center"><span class="pill gold">+${xp} XP</span>${early?' <span class="pill g">досрочно</span>':''}</p>
    <button class="btn pri wide" data-act="closeModal">Продолжить</button>`),3500);
  checkAch(); save();
}

const expOn=d=>sumOps(o=>o.type==='expense'&&o.date===d);
const inMonth=(o,m)=>o.date.slice(0,7)===m;
function leaks(m){

function genCh(){
  return [

    {id:'goal',icon:'🎯',title:'Шаг к цели',desc:'Одно занятие по любой цели',reward:40,completed:false},
    {id:'money',icon:'💳',title:'Учёт закрыт',desc:'Записать расходы за день',reward:30,completed:false}

function chProgress(c){
  const d=today();
  if(c.id==='full'){const a=actHabits().length;return {v:dayDone(d),t:a||1};}
  if(c.id==='goal'){return {v:actGoals().some(g=>goalDays(g).includes(d))?1:0,t:1};}
  return {v:S.money.closed[d]?1:0,t:1};
}
function checkChallenges(){
  if(S.challenges.date!==today()){S.challenges={date:today(),list:genCh()};}
  if(!S.challenges.list.length)S.challenges.list=genCh();
  S.challenges.list.forEach(c=>{
    const p=chProgress(c), key=`ch:${S.challenges.date}:${c.id}`;
    const done=p.v>=p.t&&p.t>0;
    if(done&&!c.completed){
      c.completed=true;
      if(grantXP(key,c.reward,{reason:'Челлендж: '+c.title}))
        celebrate(2,`${c.icon} ${c.title}`,c.desc,c.reward);
    } else if(!done&&c.completed){
      /* условие перестало выполняться — награду снимаем */
      c.completed=false;
      if(revokeXP(key))toast(`${c.icon} ${c.title} — условие не выполнено, ${c.reward} XP списаны`);
    }
  });
}
function revokeChallenge(id){
  const c=(S.challenges.list||[]).find(x=>x.id===id);
  if(!c)return;

}

let AC=null;
function sfx(name){
  if(!S.settings.sound.enabled)return;
  const T={
    'tick':{f:[880],d:.05,w:'sine'},
    'day-complete':{f:[523,659,784],d:.09,w:'triangle'},
    'milestone':{f:[659,784,988],d:.1,w:'triangle'},
    'streak-lost':{f:[330,262],d:.16,w:'sawtooth'},
    'freeze':{f:[988,1319],d:.08,w:'sine'},
    'level-up':{f:[523,659,784,1047],d:.11,w:'square'},
    'unlock':{f:[440,554,659,880],d:.1,w:'triangle'},
    'progress':{f:[698,880],d:.07,w:'sine'},
    'challenge':{f:[784,988,1175],d:.09,w:'triangle'},
    'goal-complete':{f:[523,659,784,1047,1319],d:.13,w:'square'},
    'coin':{f:[988,1319],d:.06,w:'square'}
  }[name]||{f:[440],d:.08,w:'sine'};
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const vol=clamp(S.settings.sound.volume,0,1)*.22;
    T.f.forEach((hz,i)=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type=T.w; o.frequency.value=hz;
      const t0=AC.currentTime+i*T.d;
      g.gain.setValueAtTime(0,t0);
      g.gain.linearRampToValueAtTime(vol,t0+.012);
      g.gain.exponentialRampToValueAtTime(.0001,t0+T.d*1.7);
      o.connect(g); g.connect(AC.destination);
      o.start(t0); o.stop(t0+T.d*1.8);
    });
  }catch(e){}
}
function buzz(p){if(!S.settings.vibration||!navigator.vibrate)return;try{navigator.vibrate(p);}catch(e){}}

function confetti(n=20){
  if(!S.settings.animations)return;
  const chars=['🎉','✨','🌟','⭐','🔥','💫'];
  for(let i=0;i<n;i++){
    const el=document.createElement('div');           // let → своё замыкание на элемент
    el.className='cfti';
    el.textContent=chars[(Math.random()*chars.length)|0];
    el.style.left=(Math.random()*100)+'vw';
    el.style.animationDuration=(1.5+Math.random()*1.2)+'s';
    el.style.animationDelay=(Math.random()*.35)+'s';
    document.body.appendChild(el);
    el.addEventListener('animationend',()=>el.remove());
    setTimeout(()=>el.remove(),3600);                 // страховка
  }
}
function shakeEl(q){
  if(!S.settings.animations)return;
  const el=document.querySelector(q); if(!el)return;
  el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
  setTimeout(()=>el.classList.remove('shake'),600);
}
let toastT=null;
function toast(m){
  const t=document.getElementById('toast');
  t.textContent=m; t.classList.add('show');

        <span class="pill ${TEMPPILL[t.t]}">${TEMPNAME[t.t]}</span></div>`;});

      это твой прогресс в фигуре.</div></div>`;

  /* достижения */
  const al=achList(), un=al.filter(a=>achDate(a.id));
  h+=`<div class="card"><h2>🏆 ${possess('Достижения')} <span class="tag">${un.length} из ${al.length}</span></h2>
    <div class="ach-grid">${al.slice(0,18).map(a=>{const dt=achDate(a.id);

function habitRow(hb,d,locked){
  const on=isChecked(d,hb.id), s=hb.streak.current;
  const frz=(S.closed[d]?.frozen||[]).includes(hb.id);
  const fire=s>=30?'🔥':s>=15?'🔥':s>=8?'🔴':s>=4?'🟠':s>=1?'🟡':'⚫';
  const cls=s>=15?'fire pulse':'fire';
  return `<div class="hrow ${on?'on':''} ${frz?'frz':''}">
    <div class="hico">${hb.icon}</div>
    <div class="hnm"><div class="n">${esc(hb.name)}</div>
      <div class="d">Ур.${hb.level} · рекорд ${hb.streak.peak}${frz?' · ❄️ заморозка удержала серию':''}</div></div>
    <div class="hstr"><span class="${cls}">${fire}</span> ${s}</div>
    <button class="chk ${on?'on':''}" data-act="toggle" data-id="${hb.id}"
      ${locked||hb.mirror?'disabled':''} title="${hb.mirror?'Отмечается во вкладке Финансы':''}">✓</button></div>`;
}

function vHabits(){
  const act=actHabits(), d=today(), closed=!!S.closed[d];
  let h=`<div class="card"><h2>🔥 Активные <span class="tag">${act.length} из ${S.slots.unlocked} слотов</span></h2>`;
  act.forEach(hb=>{
    h+=`<div class="hrow ${isChecked(d,hb.id)?'on':''}">

        <div class="bar thin" style="margin-top:6px"><i style="width:${clamp(hb.xp/lvlNeed(hb.level)*100,0,100)}%"></i></div></div>

      <div class="sm mut">${S.freezes.available} из ${MAX_FREEZE}<br>
        <span class="xs mut2">+1 за каждые ${FREEZE_EVERY} дней стрика</span></div></div></div>`;

  const paused=S.habits.filter(h=>h.state==='paused');
  if(paused.length){
    h+=`<div class="card"><h2>⏸ На паузе</h2><ul class="lst">`;
    paused.forEach(hb=>{h+=`<li><span class="tx">${hb.icon} ${esc(hb.name)} <span class="xs mut2">рекорд ${hb.streak.peak}</span></span>
      <button class="btn mini ok" data-act="resumeHabit" data-id="${hb.id}"
        ${act.length>=S.slots.unlocked?'disabled title="Нет свободного слота"':''}>Вернуть</button></li>`;});
    h+=`</ul></div>`;
  }
  const arch=S.habits.filter(h=>h.state==='archived');
  if(arch.length){
    h+=`<div class="card"><h2>📦 Архив</h2><ul class="lst">`;
    arch.forEach(hb=>{h+=`<li><span class="tx">${hb.icon} ${esc(hb.name)} <span class="xs mut2">рекорд ${hb.streak.peak}</span></span>
      <button class="btn mini" data-act="resumeHabit" data-id="${hb.id}"
        ${act.length>=S.slots.unlocked?'disabled':''}>Вернуть</button></li>`;});
    h+=`</ul></div>`;
  }
  return h;
}

      <button class="btn mini" data-act="reopenGoal" data-id="${g.id}">Вернуть</button></li>`;});

  if(arch.length){
    h+=`<div class="card"><h2>📦 Архив целей</h2><ul class="lst">`;
    arch.forEach(g=>{h+=`<li><span class="tx">${g.icon} ${esc(g.title)}</span>
      <button class="btn mini" data-act="reopenGoal" data-id="${g.id}">Вернуть</button></li>`;});

let moneyRange='month';
function vMoney(){

  const f={day:o=>o.date===d,week:o=>wd.includes(o.date),month:o=>inMonth(o,m),all:()=>true}[moneyRange];
  const ex=sumOps(o=>o.type==='expense'&&f(o)), inc=sumOps(o=>o.type==='income'&&f(o));
  const closed=!!S.money.closed[d];
  let h='';

  h+=`<div class="card"><h2>💰 Сводка</h2>
    <div class="seg" style="margin-bottom:10px">
      ${[['day','День'],['week','Неделя'],['month','Месяц'],['all','Всё']].map(([k,n])=>

    </div></form></div>`;

  h+=`<div class="card"><h2>📋 Учёт за ${human(d)}</h2>
    <div class="row"><div style="font-size:22px;font-weight:800">${money(expOn(d))}</div>
      <span class="pill ${closed?'g':'y'} right">${closed?'учёт закрыт':'не закрыт'}</span></div>
    <div class="row" style="margin-top:10px">
      ${closed?`<button class="btn wide" data-act="openMoney">Открыть учёт заново</button>`

    <div class="xs mut2" style="margin-top:8px">Закрытие учёта автоматически отмечает привычку «Записать расходы».

  /* утечки */

  const prevM=fmt(new Date(D(d).getFullYear(),D(d).getMonth()-1,1)).slice(0,7);

    <div style="margin-top:10px">

  const budg=+S.settings.monthBudget||0, exM=sumOps(o=>o.type==='expense'&&inMonth(o,m));

      <input type="number" name="v" min="0" step="500" value="${budg}" style="max-width:150px">
      <button class="btn" type="submit">Сохранить</button></form>`;
  if(budg>0){const r=exM/budg, left=Math.max(0,budg-exM);

  else{h+=`<ul class="lst">`;

const CHART_COLORS=['#FF9F1C','#EF4444','#10B981','#00d4ff','#A78BFA','#F59E0B','#EC4899','#38BDF8','#8B5CF6','#22D3EE'];
function drawChart(){
  const c=document.getElementById('chart'); if(!c)return;
  const dpr=window.devicePixelRatio||1, W=c.clientWidth, H=220;
  c.width=W*dpr; c.height=H*dpr;
  const x=c.getContext('2d'); x.scale(dpr,dpr); x.clearRect(0,0,W,H);
  const pad={l:30,r:8,t:10,b:20};
  const hs=S.habits.filter(h=>h.state!=='archived');
  const days=[]; for(let i=chartRange-1;i>=0;i--)days.push(addD(today(),-i));
  let max=1; hs.forEach(h=>days.forEach(d=>{if(h.history[d]>max)max=h.history[d];}));
  max=Math.ceil(max/5)*5||5;

  x.strokeStyle='rgba(255,255,255,.08)'; x.lineWidth=1; x.font='10px sans-serif';
  x.fillStyle='rgba(255,255,255,.35)'; x.textAlign='right'; x.textBaseline='middle';
  for(let i=0;i<=4;i++){
    const y=pad.t+(H-pad.t-pad.b)*i/4;
    x.beginPath(); x.moveTo(pad.l,y); x.lineTo(W-pad.r,y); x.stroke();
    x.fillText(Math.round(max*(1-i/4)),pad.l-5,y);
  }
  const px=i=>pad.l+(W-pad.l-pad.r)*(days.length<2?0:i/(days.length-1));
  const py=v=>pad.t+(H-pad.t-pad.b)*(1-v/max);
  hs.forEach((h,idx)=>{
    x.strokeStyle=CHART_COLORS[idx%CHART_COLORS.length]; x.lineWidth=2;
    x.beginPath(); let started=false;
    days.forEach((d,i)=>{const v=h.history[d];
      if(v===undefined){started=false;return;}
      const X=px(i),Y=py(v);
      if(!started){x.moveTo(X,Y);started=true;}else x.lineTo(X,Y);});
    x.stroke();
  });
  x.fillStyle='rgba(255,255,255,.35)'; x.textAlign='center'; x.textBaseline='top';
  const step=Math.ceil(days.length/5);
  days.forEach((d,i)=>{if(i%step===0)x.fillText(human(d).replace(' ',' '),px(i),H-pad.b+5);});
}

function doExport(){

  a.href=URL.createObjectURL(b); a.download=`perezagruzka-${today()}.json`;

function doImport(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    let o=null; try{o=JSON.parse(r.result);}catch(e){return toast('Это не JSON');}
    if(!valid(o))return toast('Структура файла не подходит');
    S=migrate(o); recalcAll(); save(); closeModal(); render(); toast('Импортировано');
  };
  r.onerror=()=>toast('Ошибка чтения файла');
  r.readAsText(file);
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el)return;
  const a=el.dataset.act, id=el.dataset.id;

  switch(a){
    case 'tab': view=el.dataset.v; render(); window.scrollTo(0,0); return;
    case 'closeModal': closeModal(); return;
    case 'settings': formSettings(); return;

    /* ---- знакомство ---- */
    case 'introNext': introStep=1; render(); sfx('tick'); return;
    case 'introBack': introStep=0; render(); return;
    case 'introDone':
      S.user.name=introName; S.user.greetedAt=today();
      save(); render(); return;

    /* ---- онбординг ---- */
    case 'pickHabit': {
      const i=S.habits.findIndex(h=>h.id===id);
      if(i>=0){S.habits.splice(i,1);save();}
      else{
        if(S.habits.length>=START_SLOTS)return toast(`Пока только ${START_SLOTS} — остальные откроются позже`);
        const lib=HABIT_LIB.find(x=>x.id===id);
        S.habits.push({...lib,state:'active',createdAt:today(),startedAt:today(),
          xp:0,level:1,streak:{current:0,peak:0,lost:0,lastDate:null},history:{}});
        sfx('tick'); save();
      }
      render(); return;
    }
    case 'finishOnboard':
      if(!S.habits.length)return;
      S.onboarded=true; S.challenges={date:today(),list:genCh()};
      /* стартовые цели-примеры */
      S.goals=[
        {id:uid(),title:'Завершить курс',icon:'🎓',desc:'',weeklyTarget:4,deadline:addD(today(),24),
         deadlineChanges:0,state:'active',createdAt:today(),completedAt:null,weekStreak:0,milestones:[],log:[]},
        {id:uid(),title:'Привести себя в форму',icon:'💪',desc:'',weeklyTarget:3,deadline:null,
         deadlineChanges:0,state:'active',createdAt:today(),completedAt:null,weekStreak:0,milestones:[],log:[]}
      ];
      save(); confetti(30); sfx('unlock'); render();
      toast('Поехали! Отмечайте привычки каждый день'); return;

    /* ---- привычки ---- */
    case 'toggle': {
      const d=today(), hb=habit(id);
      if(!hb||hb.mirror)return toast('Отмечается во вкладке «Финансы»');
      if(S.closed[d])return toast('День завершён — откройте для правки');
      (S.logs[d]??={});
      if(S.logs[d][id]){delete S.logs[d][id]; recalcAll();}
      else{
        S.logs[d][id]=true; sfx('tick');
        const hh=habit(id), st1=(hh?.streak.current||0)+1;
        celebrate(1,null,`${hh?hh.icon+' '+hh.name:''} · серия ${st1} дн.`,10);
      }
      checkChallenges(); save(); render(); return;
    }
    case 'closeDay': {
      const d=today();
      if(closeDay(d)){
        const c=S.closed[d];
        const ratio=c.total?c.done/c.total:0;
        /* цель, закрытая сегодня досрочно — повод для максимальной реакции */
        const epicGoal=S.goals.some(g=>g.state==='done'&&g.completedAt===d&&
                        g.deadline&&d<g.deadline);
        if(c.done===c.total&&c.total>0&&epicGoal){
          celebrate(3,withName('вот это день!').toUpperCase(),
            `Все ${c.total} привычки + цель закрыта досрочно`,c.xp,'clap');
        } else if(c.done===c.total&&c.total>0){
          celebrate(3,withName('идеальный день!').toUpperCase(),
            `Все ${c.total} привычки закрыты · ${humanFull(d)}`,c.xp,'clap');
        } else if(c.frozen.length){
          sfx('freeze');
          celebrate(2,withName('заморозка спасла серию!'),
            `❄️ Осталось заморозок: ${S.freezes.available}`,c.xp,'cheer');
        } else if(ratio<=(1/Math.max(c.total,1))||c.done===0){
          /* ничего или всего одна привычка — герой расстроен */
          celebrate(1,null,c.done===0?`Ни одной привычки · ${humanFull(d)}`
                                     :`Только ${c.done} из ${c.total} · ${humanFull(d)}`,c.xp,'sad');
        } else if(ratio>=0.6){
          celebrate(2,withName('день закрыт!'),
            `Отмечено ${c.done} из ${c.total} · ${humanFull(d)}`,c.xp,'cheer');
        } else {
          celebrate(1,withName('день закрыт'),
            `Отмечено ${c.done} из ${c.total} · можно лучше`,c.xp,'cheer');
        }
        render();
      } else toast('Нет активных привычек');
      return;
    }
    case 'openDay': openDay(today()); render(); return;
    case 'addHabit': formHabit(null); return;
    case 'editHabit': formHabit(id); return;
    case 'quickHabit': {
      const lib=HABIT_LIB.find(x=>x.id===id);
      if(actHabits().length>=S.slots.unlocked)return toast('Нет свободного слота');
      S.habits.push({...lib,state:'active',createdAt:today(),startedAt:today(),
        xp:0,level:1,streak:{current:0,peak:0,lost:0,lastDate:null},history:{}});
      recalcAll(); save(); closeModal(); render(); sfx('unlock'); toast(`${lib.icon} ${lib.name} добавлена`); return;
    }
    case 'pauseHabit': {const h=habit(id); h.state='paused'; save(); closeModal(); render(); toast('Привычка на паузе'); return;}
    case 'archHabit': {const h=habit(id); h.state='archived'; save(); closeModal(); render(); toast('В архив'); return;}
    case 'resumeHabit': {
      if(actHabits().length>=S.slots.unlocked)return toast('Нет свободного слота');
      const h=habit(id); h.state='active'; h.startedAt=today();
      recalcAll(); save(); render(); toast('Привычка вернулась'); return;
    }
    case 'pickEmoji': {
      document.querySelectorAll('.emoji-pick button').forEach(b=>b.classList.remove('on'));
      el.classList.add('on');
      document.getElementById('iconVal').value=el.dataset.e; return;
    }

    /* ---- цели ---- */
    case 'addGoal': formGoal(null); return;
    case 'editGoal': formGoal(id); return;
    case 'goalDetail': goalDetail(id); return;
    case 'touch': touchGoal(id); render(); return;
    case 'doneGoal': completeGoal(id); render(); return;
    case 'reopenGoal': {
      const g=goal(id);
      const back=revokeXP(`goal:${g.id}`);
      if(g.state==='done'&&S.stats.goalsCompleted>0)S.stats.goalsCompleted--;
      g.state='active'; g.completedAt=null;
      save(); render();
      toast(back?'Цель снова активна · награда за неё списана':'Цель снова активна');
      return;
    }
    case 'archGoal': {const g=goal(id); g.state='archived'; save(); closeModal(); render(); toast('Цель в архиве'); return;}
    case 'toggleMs': {
      const g=goal(id), m=g.milestones.find(x=>x.id===el.dataset.mid);
      m.done=!m.done;
      if(m.done){
        if(grantXP(`ms:${g.id}:${m.id}`,200,{reason:'Веха: '+m.text}))
          celebrate(2,withName('веха взята!'),m.text,200,'cheer');
      } else {
        if(revokeXP(`ms:${g.id}:${m.id}`))toast('Веха снята · 200 XP списаны');
      }
      save(); goalDetail(id); render(); return;
    }
    case 'delMs': {
      const g=goal(id);
      revokeXP(`ms:${g.id}:${el.dataset.mid}`);
      g.milestones=g.milestones.filter(x=>x.id!==el.dataset.mid);
      save(); goalDetail(id); render(); return;
    }
    case 'delLog': {
      const g=goal(id), rec=g.log.find(x=>x.id===el.dataset.lid);
      g.log=g.log.filter(x=>x.id!==el.dataset.lid);
      /* если за этот день записей не осталось — снимаем XP за занятие */
      if(rec&&!goalDays(g).includes(rec.date))revokeXP(`gday:${g.id}:${rec.date}`);
      if(rec)syncWeekNorm(g,rec.date);
      save(); goalDetail(id); render(); toast('Запись удалена · показатели пересчитаны'); return;
    }

    /* ---- финансы ---- */
    case 'mrange': moneyRange=el.dataset.r; render(); return;
    case 'crange': chartRange=+el.dataset.r; render(); return;
    case 'closeMoney': closeMoney(today()); render(); return;
    case 'openMoney': {
      const d=today(); delete S.money.closed[d];
      const h=habit('expenses');
      if(h){delete (S.logs[d]||{})[h.id]; recalcStreak(h);}
      const back=revokeXP(`money:${d}`);
      revokeChallenge('money');
      save(); render(); toast(back?'Учёт открыт · 5 XP списаны':'Учёт открыт'); return;
    }
    case 'editOp': formOp(id); return;
    case 'delOp': {
      S.money.ops=ops().filter(o=>o.id!==id); save(); render(); toast('Операция удалена'); return;
    }

    /* ---- настройки ---- */
    case 'tgSound': S.settings.sound.enabled=!S.settings.sound.enabled; save(); formSettings(); if(S.settings.sound.enabled)sfx('tick'); return;
    case 'tgVib': S.settings.vibration=!S.settings.vibration; save(); formSettings(); buzz([40]); return;
    case 'tgAnim': S.settings.animations=!S.settings.animations; save(); formSettings(); return;
    case 'tgAuto': S.settings.autoClose=!S.settings.autoClose; save(); formSettings(); return;
    case 'export': doExport(); formSettings(); return;
    case 'import': document.getElementById('impFile').click(); return;
    case 'reset':
      if(confirm('Удалить все данные без возможности восстановления?')){
        S=fresh(); save(); closeModal(); view='home'; render(); toast('Данные удалены');
      } return;
  }
});

document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-sub]'); if(!f)return;
  e.preventDefault();
  const s=f.dataset.sub, id=f.dataset.id, g=n=>f.elements[n]?f.elements[n].value.trim():'';

  switch(s){
    case 'customHabit': {
      const nm=g('name').replace(/\s+/g,' ').trim().slice(0,40);
      if(!nm)return toast('Впиши название привычки');
      if(S.habits.length>=START_SLOTS)return toast(`Пока только ${START_SLOTS} — остальные откроются позже`);
      if(S.habits.some(h=>h.name.toLowerCase()===nm.toLowerCase()))
        return toast('Такая привычка уже добавлена');
      S.habits.push({id:uid(),name:nm.charAt(0).toUpperCase()+nm.slice(1),
        icon:g('icon')||'⭐',type:'action',desc:'',custom:true,
        state:'active',createdAt:today(),startedAt:today(),xp:0,level:1,
        streak:{current:0,peak:0,lost:0,lastDate:null},history:{}});
      sfx('unlock'); buzz([40]); save(); render();   // строка очистится и появится снова
      const left=START_SLOTS-S.habits.length;
      toast(left>0?`Добавлено · можно вписать ещё ${left}`:'Добавлено · все три слота заняты');
      return;
    }
    case 'introName': {
      const n=g('name').replace(/\s+/g,' ').trim().slice(0,20);
      if(!n)return toast('Введите имя');
      introName=n.charAt(0).toUpperCase()+n.slice(1);
      introStep=2; render(); sfx('unlock'); confetti(18); return;
    }
    case 'newHabit': {
      if(actHabits().length>=S.slots.unlocked)return toast('Нет свободного слота');
      const name=g('name'); if(!name)return;
      S.habits.push({id:uid(),name,icon:g('icon')||'⭐',type:g('type'),desc:g('desc'),custom:true,
        state:'active',createdAt:today(),startedAt:today(),xp:0,level:1,
        streak:{current:0,peak:0,lost:0,lastDate:null},history:{}});
      recalcAll(); save(); closeModal(); render(); sfx('unlock'); toast('Привычка добавлена'); return;
    }
    case 'saveHabit': {
      const h=habit(id); if(!h)return;
      h.name=g('name')||h.name; h.icon=g('icon')||h.icon; h.type=g('type'); h.desc=g('desc');
      save(); closeModal(); render(); toast('Сохранено'); return;
    }
    case 'newGoal': {
      const t=g('title'); if(!t)return;
      S.goals.push({id:uid(),title:t,icon:g('icon')||'🎯',desc:g('desc'),
        weeklyTarget:clamp(+g('weekly')||3,1,7),deadline:g('deadline')||null,deadlineChanges:0,
        state:'active',createdAt:today(),completedAt:null,weekStreak:0,milestones:[],log:[]});
      save(); closeModal(); render(); sfx('unlock'); toast('Цель создана'); return;
    }
    case 'saveGoal': {
      const go=goal(id); if(!go)return;
      const nd=g('deadline')||null;
      if(go.deadline&&nd&&nd!==go.deadline)go.deadlineChanges++;
      go.title=g('title')||go.title; go.icon=g('icon')||go.icon; go.desc=g('desc');
      go.weeklyTarget=clamp(+g('weekly')||3,1,7); go.deadline=nd;
      save(); closeModal(); render(); toast('Сохранено'); return;
    }
    case 'touchNote': touchGoal(id,g('note'),+g('minutes')||null); goalDetail(id); render(); return;
    case 'addMs': {
      const t=g('text'); if(!t)return;
      goal(id).milestones.push({id:uid(),text:t,done:false});
      save(); goalDetail(id); render(); return;
    }
    case 'addOp': {
      const am=+g('amount'); if(!(am>0))return toast('Введите сумму');
      S.money.ops.push({id:uid(),type:g('type'),amount:am,date:g('date')||today(),
        cat:g('cat')||'Другое',note:g('note')});
      sfx('coin'); buzz([30]); save(); render(); toast('Операция записана'); f.reset(); return;
    }
    case 'saveOp': {
      const o=ops().find(x=>x.id===id); if(!o)return;
      o.amount=Math.max(0,+g('amount')||0); o.date=g('date'); o.cat=g('cat'); o.note=g('note');
      save(); closeModal(); render(); toast('Сохранено'); return;
    }
    case 'setName': {
      const n=g('name').replace(/\s+/g,' ').trim().slice(0,20);
      S.user.name=n?n.charAt(0).toUpperCase()+n.slice(1):'';
      save(); closeModal(); render();
      toast(n?withName('имя сохранено'):'Обращение по имени отключено'); return;
    }
    case 'setBudget': S.settings.monthBudget=+g('v')||0; save(); render(); toast('Бюджет сохранён'); return;
  }
});

/* ============================================================================
   ПАРАМЕТРИЧЕСКИЙ КАЧОК
   Одна функция рисует героя для любого уровня (1..8) и любой позы.
   Чем выше уровень — тем шире плечи, толще руки, рельефнее торс.
   pose: 'idle' | 'cheer' | 'clap' | 'sad'
   ========================================================================== */
let _hid=0;
function heroSVG(level=1,pose='idle',anim=false){
  const L=Math.max(1,Math.min(8,Math.round(level)||1)), b=(L-1)/7;
  const id='hg'+(++_hid), cx=130, sad=pose==='sad';

  /* пропорции растут вместе с уровнем */
  const sw=27+35*b;            // полуширина плеч
  const tw=19+15*b;            // полуширина талии
  const aw=12+16*b;            // толщина рук
  const lw=16+11*b;            // толщина ног
  const hr=24-4*b;             // радиус головы (у малыша голова крупнее тела)
  const yTop=110-6*b;          // линия плеч
  const yBot=178;              // талия
  const hy=yTop-hr*1.35-14;    // центр головы
  const shY=yTop+6;            // точка крепления руки
  const sxL=cx-sw+aw*0.3, sxR=cx+sw-aw*0.3;

  /* руки: подняты для хлопка, опущены когда грустно */
  const eDX=sad?(6+3*b):(16+10*b), eDY=sad?32:30;
  const hDX=sad?(4+2*b):(8+5*b),  hDY=sad?66:60;

  /* грудные, пресс, трапеции появляются по мере роста */
  const chest=b>0.15?`
    <ellipse cx="${cx-sw*0.42}" cy="${yTop+24}" rx="${sw*0.40}" ry="${10+5*b}" fill="rgba(255,255,255,.17)"/>
    <ellipse cx="${cx+sw*0.42}" cy="${yTop+24}" rx="${sw*0.40}" ry="${10+5*b}" fill="rgba(255,255,255,.17)"/>`:'';
  const rows=b>0.62?3:b>0.28?2:0;
  let abs='';
  for(let i=0;i<rows;i++){
    const y=yBot-44+i*13;
    abs+=`<rect x="${cx-12.5}" y="${y}" width="11" height="9.5" rx="3" fill="rgba(0,0,0,.14)"/>
          <rect x="${cx+1.5}"  y="${y}" width="11" height="9.5" rx="3" fill="rgba(0,0,0,.14)"/>`;
  }
  const traps=b>0.35?`<path d="M${cx-sw+6} ${yTop+2} Q${cx} ${yTop-20-10*b} ${cx+sw-6} ${yTop+2}
    Q${cx} ${yTop-6} ${cx-sw+6} ${yTop+2}z" fill="rgba(0,0,0,.13)"/>`:'';

  /* лицо: спереди / затылок (для разворота в грустной анимации) */
  const eyeY=hy+2, eyeDX=hr*0.44, browY=hy-hr*0.42;
  const face=`
    <g class="cel-front">
      <path d="M${cx-hr*1.22} ${hy-hr*0.35} Q${cx} ${hy-hr*2.05} ${cx+hr*1.22} ${hy-hr*0.35}
        Q${cx} ${hy-hr*1.15} ${cx-hr*1.22} ${hy-hr*0.35}z" fill="#2b1c12"/>
      <g class="cel-eyes">
        <ellipse cx="${cx-eyeDX}" cy="${eyeY}" rx="4.2" ry="${sad?3.2:5.2}" fill="#1b2434"/>
        <ellipse cx="${cx+eyeDX}" cy="${eyeY}" rx="4.2" ry="${sad?3.2:5.2}" fill="#1b2434"/>
      </g>
      ${sad
        ?`<path d="M${cx-eyeDX-7} ${browY+1} q7 4 13 6" stroke="#2b1c12" stroke-width="3.2" fill="none" stroke-linecap="round"/>
          <path d="M${cx+eyeDX+7} ${browY+1} q-7 4 -13 6" stroke="#2b1c12" stroke-width="3.2" fill="none" stroke-linecap="round"/>
          <path class="cel-mouth" d="M${cx-9} ${hy+hr*0.78} q9 -8 18 0" stroke="#7a2b2b" stroke-width="3.4"
             fill="none" stroke-linecap="round"/>`
        :`<path d="M${cx-eyeDX-7} ${browY+4} q7 -5 13 -1" stroke="#2b1c12" stroke-width="3.4" fill="none" stroke-linecap="round"/>
          <path d="M${cx+eyeDX+7} ${browY+4} q-7 -5 -13 -1" stroke="#2b1c12" stroke-width="3.4" fill="none" stroke-linecap="round"/>
          <path class="cel-mouth" d="M${cx-10} ${hy+hr*0.62} q10 13 20 0 q-10 6 -20 0z" fill="#7a2b2b"/>
          <path d="M${cx-8.5} ${hy+hr*0.62} q8.5 3 17 0" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>`}
    </g>
    <g class="cel-back" opacity="0">
      <ellipse cx="${cx}" cy="${hy}" rx="${hr*1.25}" ry="${hr*1.35}" fill="#2b1c12"/>
      <circle cx="${cx-hr*1.24}" cy="${hy+2}" r="4.6" fill="url(#${id}s)"/>
      <circle cx="${cx+hr*1.24}" cy="${hy+2}" r="4.6" fill="url(#${id}s)"/>
    </g>`;

  const armCls=anim?(sad?'':'cel-armL'):'';
  const armClsR=anim?(sad?'':'cel-armR'):'';

  return `<svg class="hero-svg${anim?' cel-hero':''}" viewBox="0 0 260 262"
      xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Уровень ${L}">
    <defs>
      <linearGradient id="${id}s" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FFC98A"/><stop offset="100%" stop-color="#F0A85F"/></linearGradient>
      <linearGradient id="${id}d" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#F5B673"/><stop offset="100%" stop-color="#DE9247"/></linearGradient>
      <linearGradient id="${id}t" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${sad?'#4a6ב80'.replace('ב','b'):'#00d9ff'}"/>
        <stop offset="100%" stop-color="${sad?'#2d4257':'#1e90ff'}"/></linearGradient>
    </defs>

    <ellipse class="${anim?'cel-shadow':''}" cx="${cx}" cy="248" rx="${34+26*b}" ry="8"
      fill="rgba(0,0,0,.45)"/>

    <g class="${anim?'cel-body':''}">
      <!-- ноги -->
      <path d="M${cx-tw*0.52} ${yBot-4} q-3 28 1 52" stroke="url(#${id}d)" stroke-width="${lw}"
        fill="none" stroke-linecap="round"/>
      <path d="M${cx+tw*0.52} ${yBot-4} q3 28 -1 52" stroke="url(#${id}d)" stroke-width="${lw}"
        fill="none" stroke-linecap="round"/>
      <rect x="${cx-tw*0.52-lw*0.62}" y="238" width="${lw*1.24}" height="11" rx="5" fill="#0f1f35"/>
      <rect x="${cx+tw*0.52-lw*0.62}" y="238" width="${lw*1.24}" height="11" rx="5" fill="#0f1f35"/>

      <!-- шорты -->
      <path d="M${cx-tw-2} ${yBot-14} h${tw*2+4} q4 18 1 28 h${-(tw-2)} l${-(3)} -12 l-3 12
        h${-(tw-2)} q-3-10 1-28z" fill="#0f1f35"/>

      <!-- торс -->
      <path d="M${cx-sw} ${yTop} Q${cx} ${yTop-16} ${cx+sw} ${yTop}
        L${cx+tw} ${yBot} Q${cx} ${yBot+11} ${cx-tw} ${yBot}z" fill="url(#${id}t)"/>
      ${chest}${abs}${traps}

      <!-- шея -->
      <rect x="${cx-7-3*b}" y="${hy+hr*0.95}" width="${14+6*b}" height="${yTop-hy-hr*0.85}"
        fill="url(#${id}d)"/>

      <!-- руки -->
      <g class="${armCls}" style="transform-origin:${sxL}px ${shY}px">
        <path d="M${sxL} ${shY} Q${sxL-eDX} ${shY+eDY} ${sxL-hDX} ${shY+hDY}"
          stroke="url(#${id}s)" stroke-width="${aw}" fill="none" stroke-linecap="round"/>
        <circle cx="${sxL-eDX*0.85}" cy="${shY+eDY*0.8}" r="${aw*0.62}" fill="url(#${id}s)"/>
        <circle cx="${sxL-eDX*0.85}" cy="${shY+eDY*0.72}" r="${aw*0.32}" fill="rgba(255,255,255,.2)"/>
        <circle cx="${sxL-hDX}" cy="${shY+hDY}" r="${aw*0.52}" fill="url(#${id}d)"/>
      </g>
      <g class="${armClsR}" style="transform-origin:${sxR}px ${shY}px">
        <path d="M${sxR} ${shY} Q${sxR+eDX} ${shY+eDY} ${sxR+hDX} ${shY+hDY}"
          stroke="url(#${id}s)" stroke-width="${aw}" fill="none" stroke-linecap="round"/>
        <circle cx="${sxR+eDX*0.85}" cy="${shY+eDY*0.8}" r="${aw*0.62}" fill="url(#${id}s)"/>
        <circle cx="${sxR+eDX*0.85}" cy="${shY+eDY*0.72}" r="${aw*0.32}" fill="rgba(255,255,255,.2)"/>
        <circle cx="${sxR+hDX}" cy="${shY+hDY}" r="${aw*0.52}" fill="url(#${id}d)"/>
      </g>

      <!-- голова -->
      <g class="${anim?'cel-head':''}" style="transform-origin:${cx}px ${hy+hr}px">
        <ellipse cx="${cx}" cy="${hy}" rx="${hr*1.25}" ry="${hr*1.35}" fill="url(#${id}s)"/>
        ${face}
      </g>
    </g>

    ${anim&&!sad?`<g class="cel-clapfx" style="transform-origin:${cx}px ${shY+hDY}px">
      <path d="M${cx} ${shY+hDY-16} l6 -14 l3 14 l14 4 l-14 4 l-3 14 l-6-14 l-14-4z" fill="#FFD700"/>
    </g>`:''}
  </svg>`;
}

/* ---- разметка оверлея (вставляется один раз) ---- */
(function initCelebrate(){
  if(document.getElementById('celebrate'))return;
  const el=document.createElement('div');
  el.id='celebrate';
  el.className='celebrate';
  el.innerHTML=`
    <div class="cel-rays"></div>
    <div class="cel-stage">
      <div id="celHero"></div>
      <div class="cel-title" id="celTitle"></div>
      <div class="cel-sub" id="celSub"></div>
      <div class="cel-xp" id="celXp"></div>
      <div class="cel-hint">нажмите, чтобы продолжить</div>
    </div>`;
  document.body.appendChild(el);
  el.addEventListener('click',()=>hideCelebrate());
})();

/* --------------------------- звук: аплодисменты -------------------------- */
let noiseBuf=null;
function getNoise(ctx){
  if(noiseBuf&&noiseBuf.sampleRate===ctx.sampleRate)return noiseBuf;
  const len=ctx.sampleRate*1.2, b=ctx.createBuffer(1,len,ctx.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  noiseBuf=b; return b;
}
/* один хлопок = короткий всплеск шума через полосовой фильтр */
function oneClap(ctx,t,gain,pan){
  const src=ctx.createBufferSource(); src.buffer=getNoise(ctx);
  src.playbackRate.value=.8+Math.random()*.7;
  const bp=ctx.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.value=1100+Math.random()*2200; bp.Q.value=.7+Math.random();
  const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=600;
  const g=ctx.createGain();
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(gain,t+.004);
  g.gain.exponentialRampToValueAtTime(.0001,t+.05+Math.random()*.06);
  let node=src; node.connect(bp); bp.connect(hp); hp.connect(g);
  if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=pan;g.connect(p);p.connect(ctx.destination);}
  else g.connect(ctx.destination);
  src.start(t); src.stop(t+.2);
}
/* толпа: много хлопков вразнобой + гул + свист */
function applause(level=1){
  if(!S.settings.sound.enabled)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const t0=AC.currentTime+.02;
    const vol=clamp(S.settings.sound.volume,0,1);
    const dur=level>=3?2.6:level>=2?2.0:1.4;
    const n=Math.round((level>=3?150:level>=2?110:70));

    /* сами хлопки */
    for(let i=0;i<n;i++){
      const t=t0+Math.pow(Math.random(),.7)*dur;
      oneClap(AC,t,(.05+Math.random()*.09)*vol,(Math.random()*2-1)*.8);
    }
    /* гул толпы */
    const src=AC.createBufferSource(); src.buffer=getNoise(AC); src.loop=true;
    const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900;
    const g=AC.createGain();
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(.05*vol,t0+.25);
    g.gain.setValueAtTime(.05*vol,t0+dur*.6);
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    src.connect(lp); lp.connect(g); g.connect(AC.destination);
    src.start(t0); src.stop(t0+dur+.1);

    /* одобрительные возгласы «уууу!» */
    if(level>=2){
      const whoops=level>=3?4:2;
      for(let i=0;i<whoops;i++){
        const t=t0+.15+Math.random()*dur*.6;
        const o=AC.createOscillator(), og=AC.createGain();
        o.type='sawtooth';
        const base=380+Math.random()*260;
        o.frequency.setValueAtTime(base,t);
        o.frequency.exponentialRampToValueAtTime(base*1.7,t+.18);
        o.frequency.exponentialRampToValueAtTime(base*1.1,t+.5);
        const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1400;
        og.gain.setValueAtTime(0,t);
        og.gain.linearRampToValueAtTime(.05*vol,t+.09);
        og.gain.exponentialRampToValueAtTime(.0001,t+.55);
        o.connect(f); f.connect(og); og.connect(AC.destination);
        o.start(t); o.stop(t+.6);
      }
    }
    /* фанфара на максимальном уровне */
    if(level>=3){
      [523,659,784,1047].forEach((hz,i)=>{
        const t=t0+.05+i*.11;
        const o=AC.createOscillator(), g2=AC.createGain();
        o.type='square'; o.frequency.value=hz;
        g2.gain.setValueAtTime(0,t);
        g2.gain.linearRampToValueAtTime(.07*vol,t+.02);
        g2.gain.exponentialRampToValueAtTime(.0001,t+.42);
        o.connect(g2); g2.connect(AC.destination);
        o.start(t); o.stop(t+.45);
      });
    }
  }catch(e){}
}

/* ------------------------------ показ ----------------------------------- */
/* фразы строятся с обращением по имени: «Константин, молодец!» */
const PRAISE_1=['молодец!','так держать!','есть отметка!','красава!','пошло дело!'];
const PRAISE_2=['отличная работа!','так и надо!','держим темп!','сильно!','уверенно!'];
const PRAISE_3=['идеальный день!','ты легенда!','вот это сила!','невероятно!','ты чемпион!'];
/* когда день не получился — без упрёков, но честно */
const SUPPORT=['я немного разочарован.','сегодня не вышло — это не конец.',
  'бывает. Завтра начнём заново.','один слабый день ничего не решает.','я подожду. Возвращайся.'];
const pick=a=>a[(Math.random()*a.length)|0];
/* родительный падеж для заголовков: «Успехи Константина» */
function possessName(){
  const n=uname(); if(!n)return '';
  const last=n.slice(-1).toLowerCase();
  if(last==='а')return n.slice(0,-1)+'ы';
  if(last==='я')return n.slice(0,-1)+'и';
  if(last==='й'||last==='ь')return n.slice(0,-1)+'я';
  if('аеёиоуыэюя'.includes(last))return n;      // несклоняемые: Лео, Мари
  return n+'а';
}
const possess=word=>uname()?`${word} ${possessName()}`:word;
const PRAISE={
  get 1(){return [withName(pick(PRAISE_1))]},
  get 2(){return [withName(pick(PRAISE_2))]},
  get 3(){return [withName(pick(PRAISE_3)).toUpperCase()]}
};

let celTimer=null;
/* level: 1 лёгкая · 2 обычная · 3 максимальная
   mood:  'sad' грустный · 'cheer' машет руками · 'clap' аплодирует     */
function celebrate(level=1,title,sub,xp,mood){
  const el=document.getElementById('celebrate');
  if(!el)return;
  mood=mood||(level>=3?'clap':'cheer');
  const isSad=mood==='sad';

  if(!S.settings.animations){
    if(title)toast(title);
    if(isSad)sfx('streak-lost'); else applause(level);
    return;
  }

  el.className='celebrate show lv'+level+' mood-'+mood;
  document.getElementById('celHero').innerHTML=
    heroSVG(S.profile.level,isSad?'sad':'clap',true);
  document.getElementById('celTitle').textContent=
    title||(isSad?withName(pick(SUPPORT)):PRAISE[level][0]);
  document.getElementById('celSub').textContent=sub||'';
  const xpEl=document.getElementById('celXp');
  xpEl.textContent=xp?`+${xp} XP`:''; xpEl.style.display=xp?'':'none';

  if(isSad){
    sfx('streak-lost'); buzz([180,90,180]);
  } else {
    applause(level);
    buzz(level>=3?[60,60,60,60,140]:level>=2?[50,60,50]:[40]);
    confetti(level>=3?70:level>=2?40:22);
  }

  clearTimeout(celTimer);
  celTimer=setTimeout(()=>hideCelebrate(),isSad?3000:level>=3?3400:level>=2?2600:1900);
}
function hideCelebrate(){
  const el=document.getElementById('celebrate');
  if(!el||!el.classList.contains('show'))return;
  clearTimeout(celTimer);
  el.classList.add('out');
  setTimeout(()=>{el.className='celebrate';},280);
}


function boot(){
  const bt=document.getElementById('buildTag'); if(bt)bt.textContent=BUILD;
  idbOpen();
  load();
  recalcAll();
  recomputeXP();          // уровень и XP всегда выводятся из журнала
  if(S.onboarded){
    const n=autoClose();
    checkChallenges();
    checkAch();
    save();
    if(n)setTimeout(()=>toast(`Автоматически завершено дней: ${n}`),700);
    const le=S.settings.lastExport;
    if(!le||addD(le.slice(0,10),14)<today())
      setTimeout(()=>toast('Давно не делали экспорт — сохраните резервную копию'),2600);
  }
  render();
}
boot();
